[package]
name = "pilgrim"
version = "0.2.0"
description = "A vertical bullet-hell shmup: one small ship, a long way from home"
repository = "https://github.com/Bananalorian/macroshmup"
edition = "2024"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }

# native gamepads (the web build reads the browser Gamepad API through a tiny JS plugin)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gilrs = "0.11"

[profile.dev.package.'*']
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
