[package]
name = "pilgrim"
version = "0.10.2"
description = "A vertical bullet-hell shmup: one small ship, a long way from home"
repository = "https://github.com/Bananalorian/macroshmup"
edition = "2024"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }

# gamepads on Linux and macOS (Windows reads XInput directly, see src/pad.rs; the web
# build reads the browser Gamepad API through a tiny JS plugin)
[target.'cfg(not(any(windows, target_arch = "wasm32")))'.dependencies]
gilrs = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package.'*']
opt-level = 3

# the fairness tests play every pattern thousands of frames with the bot
[profile.test]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
